# Configuración de Netlify — sitio estático, sin build
[build]
  publish = "."
  command = ""

# HTML, CSS y JS: el navegador siempre pregunta si hay versión nueva,
# así los cambios se ven apenas se publica (nada queda guardado viejo).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fotos y logos: se guardan 1 día en el celular para cargar rápido
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
